name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npx turbo typecheck lint

      - run: npm test

      - run: npm publish --access public
        working-directory: packages/service-loom-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish --access public
        working-directory: packages/service-loom-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
