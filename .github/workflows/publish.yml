name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx turbo typecheck lint

      - run: npm test

      - run: npm publish --access public --provenance
        working-directory: packages/service-loom-js

      - run: npm publish --access public --provenance
        working-directory: packages/service-loom-react
